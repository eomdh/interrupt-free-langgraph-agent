services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    # 포트를 호스트에 공개하지 않는다. 앱은 내부 네트워크로 db:5432 에 붙으므로
    # 공개는 사람이 들여다볼 때만 쓸모가 있는데, 로컬에 Postgres 가 떠 있으면
    # 기본 포트가 겹쳐 `docker compose up` 자체가 실패한다 — 클론해서 바로
    # 돌아가야 하는 데모에서 그건 너무 비싼 대가다.
    # DB 를 직접 볼 일이 있으면: docker compose exec db psql -U agent -d agent
    healthcheck:
      # 앱이 뜨기 전에 DB가 실제로 붙을 수 있어야 한다. depends_on만으로는
      # 컨테이너 기동만 기다리고 서버 준비까지는 안 본다.
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
      # 기본은 목 모드다. 실제 모델을 붙이려면 .env에 키를 넣는다(.env.example 참조).
      LLM_MODE: ${LLM_MODE:-fake}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
