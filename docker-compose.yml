services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    healthcheck:
      # 앱이 뜨기 전에 DB가 실제로 붙을 수 있어야 한다. depends_on만으로는
      # 컨테이너 기동만 기다리고 서버 준비까지는 안 본다.
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
